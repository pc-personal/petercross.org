<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter Cross</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #15171A; /* Architectural Slate */
            --text-primary: #F9FAFB; /* Crisp White for headings */
            --text-secondary: #A1A1AA; /* Muted Silver for body */
            --border-color: #2D3139; /* Subtle structural lines */
            --accent-color: #FFFFFF;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            
            /* Smooth structural fade in */
            animation: fadeIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        main {
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        /* Subtle structural accent line */
        main::before {
            content: '';
            position: absolute;
            top: -2.5rem;
            left: 0;
            width: 40px;
            height: 2px;
            background-color: var(--border-color);
        }

        header {
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .tagline {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--text-secondary);
        }

        section {
            margin-bottom: 3rem;
        }

        h2 {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            font-weight: 500;
        }

        p {
            font-weight: 400;
            margin-bottom: 1.25rem;
            font-size: 1.05rem;
            color: var(--text-secondary);
            max-width: 90%;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-start;
        }

        a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 400;
            font-size: 1.05rem;
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-flex;
            align-items: center;
        }

        a::before {
            content: "→";
            margin-right: 0.75rem;
            opacity: 0.5;
            transform: translateX(-5px);
            transition: all 0.3s ease;
            font-family: 'Roboto Mono', monospace;
            color: var(--border-color);
        }

        a:hover {
            color: var(--accent-color);
            transform: translateX(5px);
        }

        a:hover::before {
            opacity: 1;
            transform: translateX(0);
            color: var(--accent-color);
        }

    </style>
</head>
<body>
    <main>
        <header>
            <h1>Peter Cross</h1>
            <div class="tagline">Data & AI Enthusiast</div>
        </header>

        <section id="about">
            <h2>About</h2>
            <p>Over 20 years of leadership experience in all things data and AI.</p>
            <p>Data wrangler and part-time dog chaperone.</p>
        </section>

        <section id="connect">
            <h2>Connect</h2>
            <div class="links">
                <a href="https://linkedin.com/in/peter-cross-16204929/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <span id="contact-link"></span>
            </div>
        </section>
    </main>

    <script>
        // Obfuscated email injection
        document.addEventListener('DOMContentLoaded', function() {
            // Fragmented Base64 to defeat basic scrapers and regex hunters
            // Parts: "outreach", "@", "petercross", ".org"
            const parts = ["b3V0cmVhY2g=", "QA==", "cGV0ZXJjcm9zcw==", "Lm9yZw=="];
            try {
                const email = parts.map(p => atob(p)).join('');
                const container = document.getElementById('contact-link');
                const link = document.createElement('a');
                link.href = 'mailto:' + email;
                link.textContent = 'Email';
                container.appendChild(link);
            } catch (e) {
                console.error("Initialization error");
            }
        });
    </script>
</body>
</html>
